version: 0.2
phases:
  install:
    runtime-versions:
      java: corretto21
      python: 3.11
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install --upgrade aws-sam-cli
      - sam --version
  pre_build:
    commands:
      - echo "Starting pre_buildd phase..."
      - sam validate
      - sam build --use-container

  build:
    commands:
      - echo "Starting build phase..."
      - sam package --region ${AWS_DEFAULT_REGION} --s3-bucket ${ARTIFACT_BUCKET} --output-template-file packaged-template.yaml
artifacts:
  files:
    - packaged-template.yaml
  name: BuildOutput
